<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Weight Tracking</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <div class="top">
    <svg class="appicon" viewBox="0 0 512 512" aria-hidden="true"><defs><radialGradient id="bgB" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#1d2a3d"/><stop offset="1" stop-color="#101824"/></radialGradient></defs><rect width="512" height="512" rx="110" fill="url(#bgB)"/><g transform="translate(256 256) scale(0.92) translate(-256 -290)">
    <path d="M44 318 A 212 212 0 0 1 468 318 L 468 370 Q 468 396 442 396 L 70 396 Q 44 396 44 370 Z" fill="#ebe5d5"/>
    <line x1="75.8" y1="271.7" x2="132.0" y2="286.2" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="82.0" y1="252.3" x2="111.9" y2="263.6" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="90.3" y1="233.6" x2="118.8" y2="248.1" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="100.5" y1="215.9" x2="127.3" y2="233.5" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="112.7" y1="199.4" x2="157.4" y2="236.4" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="126.6" y1="184.4" x2="148.8" y2="207.4" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="142.0" y1="171.0" x2="161.6" y2="196.3" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="158.8" y1="159.4" x2="175.5" y2="186.7" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="176.8" y1="149.7" x2="201.5" y2="202.2" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="195.8" y1="142.0" x2="206.1" y2="172.3" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="215.4" y1="136.5" x2="222.4" y2="167.7" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="235.6" y1="133.1" x2="239.1" y2="164.9" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="256.0" y1="132.0" x2="256.0" y2="190.0" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="276.4" y1="133.1" x2="272.9" y2="164.9" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="296.6" y1="136.5" x2="289.6" y2="167.7" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="316.2" y1="142.0" x2="305.9" y2="172.3" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="335.2" y1="149.7" x2="310.5" y2="202.2" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="353.2" y1="159.4" x2="336.5" y2="186.7" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="370.0" y1="171.0" x2="350.4" y2="196.3" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="385.4" y1="184.4" x2="363.2" y2="207.4" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="399.3" y1="199.4" x2="354.6" y2="236.4" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/><line x1="411.5" y1="215.9" x2="384.7" y2="233.5" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="421.7" y1="233.6" x2="393.2" y2="248.1" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="430.0" y1="252.3" x2="400.1" y2="263.6" stroke="#8b8577" stroke-width="6" stroke-linecap="round"/><line x1="436.2" y1="271.7" x2="380.0" y2="286.2" stroke="#2b2a26" stroke-width="11" stroke-linecap="round"/>
    <path d="M121.3 142.3 l34 0 l-17 30 z" fill="#1f9e8d" transform="rotate(322.20 138.3 166.3)"/>
    <path d="M265.2,355.5 L305.6,153.1 Q301.3,141.7 292.0,149.7 L229.9,346.4 Z" fill="#e6483f" stroke="#e6483f" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="256" cy="318" r="44" fill="#e6483f"/><circle cx="256" cy="318" r="15" fill="#ebe5d5"/></g></svg>
    <div class="name" id="topTitle">Weight Tracking</div>
    <div class="grow"></div>
    <div class="date" id="todayLabel"></div>
    <button class="sync-ic off" id="syncIcon" aria-label="Trạng thái đồng bộ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8a5 5 0 1 1 1.2-9.86A6 6 0 0 1 20.5 12a3.5 3.5 0 0 1-3 7z"/></svg></button>
  </div>

  <!-- ===================== CHART SCREEN ===================== -->
  <div id="chartScreen" class="screen active">
    <div class="cols">
      <div class="main">
        <div class="reading" id="reading">
          <div class="tapewrap" id="tapeWrap">
            <svg id="tapeSvg" height="70"></svg>
            <div class="needle"></div>
            <div class="tag" id="tapeTag">--<small>kg</small></div>
          </div>
          <div class="slim">
            <span id="goalLine"></span>
            <span id="bmiLine"></span>
            <span id="weekLine"></span>
          </div>
        </div>
        <div class="tabs" id="rangeTabs">
          <button data-days="7">Tuần</button>
          <button data-days="31">Tháng</button>
          <button data-days="92">3 tháng</button>
          <button data-days="365">Năm</button>
          <button data-days="0">Tất cả</button>
        </div>
        <div id="chartWrap">
          <canvas id="chartCanvas"></canvas>
          <div id="tooltip">
            <div class="row"><div class="d"></div>
            <button class="edit" id="tooltipEditBtn" title="Sửa" aria-label="Sửa lần cân này"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
            <div class="n"></div>
          </div>
          <div id="emptyState"><div>Chưa có số cân nào.</div><div>Bấm nút + để nhập lần cân đầu tiên.</div></div>
        </div>
      </div>
      <div class="side" id="journalSide">
        <button class="jhead" id="journalHead" aria-expanded="true">
          <span class="lbl">Nhật ký</span><span class="cnt" id="journalCount"></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="rows" id="journalRows"></div>
      </div>
    </div>
  </div>

  <!-- ===================== SETTINGS SCREEN ===================== -->
  <div id="settingsScreen" class="screen">
    <div class="settings-body">
      <div class="field">
        <label for="goalInput">Mục tiêu cân nặng (kg)</label>
        <input type="number" id="goalInput" step="0.1" placeholder="VD: 78.8">
      </div>
      <div class="field">
        <label for="deadlineInput">Hạn chót đạt mục tiêu</label>
        <div class="date-row">
          <input type="date" id="deadlineInput">
          <button class="date-clear" id="deadlineClear" type="button" aria-label="Bỏ hạn chót" hidden>✕</button>
        </div>
        <div class="sub" id="planNote"></div>
      </div>
      <div class="field">
        <label for="heightInput">Chiều cao (cm), để tính BMI, có thể bỏ trống</label>
        <input type="number" id="heightInput" step="0.1" placeholder="VD: 170">
      </div>

      <div class="section-title">Dữ liệu</div>
      <button class="rowbtn" id="exportBtn"><span>Xuất file CSV</span><span class="arrow">⇢</span></button>
      <button class="rowbtn" id="importBtn"><span>Nhập file CSV</span><span class="arrow">⇢</span></button>
      <input type="file" id="csvFileInput" accept=".csv,text/csv,text/plain">

      <div class="section-title">Đồng bộ Firebase</div>
      <div id="syncPanel"></div>

      <div class="section-title">Thử nghiệm</div>
      <button class="rowbtn" id="tuneOpenBtn"><span>Chỉnh thông số kim &amp; nấc thước</span><span class="arrow">⇢</span></button>

      <div class="section-title">Cập nhật</div>
      <button class="rowbtn" id="checkUpdateBtn"><span>Kiểm tra bản mới</span><span class="arrow" id="appVersionLabel">⇢</span></button>

      <div class="section-title">Khác</div>
      <button class="rowbtn" id="clearBtn" style="color:var(--red)"><span>Xoá toàn bộ dữ liệu</span><span class="arrow">⚠</span></button>
    </div>
  </div>

  <!-- ===================== BOTTOM NAV ===================== -->
  <div id="bottomNav">
    <button class="tab on" id="navChart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><span>Biểu đồ</span></button>
    <button class="add" id="navAdd" title="Thêm cân nặng" aria-label="Thêm cân nặng"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 4v22M4 15h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></button>
    <button class="tab" id="navSettings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Cài đặt</span></button>
  </div>

  <!-- bảng chỉnh thông số kim (thử nghiệm) -->
  <div id="tunePanel">
    <div class="tune-head">
      <span>Chỉnh kim — kéo thước ở trên để thử</span>
      <button id="tuneCloseBtn" aria-label="Đóng">✕</button>
    </div>
    <div id="tuneRows"></div>
    <div class="tune-btns">
      <button class="rowbtn" id="tuneResetBtn">Về mặc định</button>
      <button class="rowbtn primary" id="tuneCopyBtn">Chép số</button>
    </div>
  </div>

  <div id="credit">Created by Mondiro</div>
</div>

<!-- ===================== KẾT QUẢ SAU KHI CÂN (trượt lên, chạm để tắt) ===================== -->
<div id="resultCatcher"></div>
<div id="resultSheet" role="status" aria-live="polite">
  <div class="ricon" id="resultIcon"></div>
  <div class="rtext"><div class="rtitle" id="resultTitle"></div><div class="rsub" id="resultSub"></div></div>
</div>

<!-- ===================== ADD/EDIT ENTRY MODAL (dùng chung cho nút + và nút sửa) ===================== -->
<div id="entryModal">
  <div class="modal-header"><span class="editIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span id="modalTitle">Cân hôm nay</span></div>
  <div id="entryPills">
    <button class="pill-btn" id="dateBtn"><span class="ic">📅</span><span id="dateBtnLabel">Hôm nay</span></button>
    <input type="date" id="dateSheetInput" style="position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; left:-9999px;">
    <button class="pill-btn" id="noteBtn"><span class="ic">💬</span><span id="noteBtnLabel">Thêm ghi chú</span></button>
  </div>
  <div id="pickerArea">
    <div class="wheel-center-line"></div>
    <div class="wheel-col" id="intCol"></div>
    <div class="dot-sep">,</div>
    <div class="wheel-col" id="decCol"></div>
    <div class="unit">kg</div>
  </div>
  <div id="modalNav">
    <button class="roundbtn ok" id="saveEntryBtn" aria-label="Lưu"><svg width="36" height="36" viewBox="0 0 30 30"><path d="M6 15.5l6 6L24 9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="roundbtn cancel" id="cancelEntryBtn" aria-label="Huỷ"><svg width="36" height="36" viewBox="0 0 30 30"><path d="M11 7L5 13l6 6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 13h11a7 7 0 0 1 0 14h-3" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<!-- note sheet -->
<div class="overlay" id="noteOverlay">
  <div class="sheet">
    <h3>Ghi chú</h3>
    <textarea id="noteSheetInput" placeholder="Ghi chú (vd: tối qua ăn lẩu, đi du lịch...)"></textarea>
    <div class="sheet-actions">
      <button class="cancel" id="noteCancelBtn">Huỷ</button>
      <button class="save" id="noteSaveBtn">Xong</button>
    </div>
  </div>
</div>

<!-- update sheet -->
<div class="overlay" id="updateOverlay">
  <div class="sheet">
    <h3 id="updateTitle">Có bản cập nhật mới</h3>
    <div id="updateText" style="font-size:14px; color:var(--text-dim); line-height:1.5; white-space:pre-line;"></div>
    <div class="sheet-actions" id="updateActions">
      <button class="cancel" id="updateLaterBtn">Để sau</button>
      <button class="save" id="updateNowBtn">Cập nhật</button>
    </div>
  </div>
</div>

<script src="seed-data.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
