<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Weight Tracking</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <div class="top">
    <svg class="appicon" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#22344d"/><polyline points="7,27 14,21 20,24 27,15 33,12" fill="none" stroke="#4fd6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="12" r="3.6" fill="#e6483f"/></svg>
    <div class="name" id="topTitle">Weight Tracking</div>
    <div class="grow"></div>
    <div class="date" id="todayLabel"></div>
  </div>

  <!-- ===================== CHART SCREEN ===================== -->
  <div id="chartScreen" class="screen active">
    <div class="cols">
      <div class="main">
        <div class="reading" id="reading">
          <div class="tapewrap" id="tapeWrap">
            <svg id="tapeSvg" height="70"></svg>
            <div class="needle"></div>
            <div class="tag" id="tapeTag">--<small>kg</small></div>
          </div>
          <div class="slim">
            <span id="goalLine"></span>
            <span id="bmiLine"></span>
            <span id="weekLine"></span>
          </div>
        </div>
        <div class="tabs" id="rangeTabs">
          <button data-days="7">Tuần</button>
          <button data-days="31">Tháng</button>
          <button data-days="92">3 tháng</button>
          <button data-days="365">Năm</button>
          <button data-days="0">Tất cả</button>
        </div>
        <div id="chartWrap">
          <canvas id="chartCanvas"></canvas>
          <div id="tooltip">
            <div class="w"></div><div class="d"></div><div class="n"></div>
            <button class="edit" id="tooltipEditBtn" title="Sửa" aria-label="Sửa lần cân này"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          </div>
          <div id="emptyState"><div>Chưa có số cân nào.</div><div>Bấm nút + để nhập lần cân đầu tiên.</div></div>
        </div>
      </div>
      <div class="side" id="journalSide">
        <button class="jhead" id="journalHead" aria-expanded="true">
          <span class="lbl">Nhật ký</span><span class="cnt" id="journalCount"></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="rows" id="journalRows"></div>
      </div>
    </div>
  </div>

  <!-- ===================== SETTINGS SCREEN ===================== -->
  <div id="settingsScreen" class="screen">
    <div class="settings-body">
      <div class="field">
        <label for="goalInput">Mục tiêu cân nặng (kg)</label>
        <input type="number" id="goalInput" step="0.1" placeholder="VD: 78.8">
      </div>
      <div class="field">
        <label for="heightInput">Chiều cao (cm), để tính BMI, có thể bỏ trống</label>
        <input type="number" id="heightInput" step="0.1" placeholder="VD: 170">
      </div>

      <div class="section-title">Dữ liệu</div>
      <button class="rowbtn" id="exportBtn"><span>Xuất file CSV</span><span class="arrow">⇢</span></button>
      <button class="rowbtn" id="importBtn"><span>Nhập file CSV</span><span class="arrow">⇢</span></button>
      <input type="file" id="csvFileInput" accept=".csv,text/csv,text/plain">

      <div class="section-title">Cập nhật</div>
      <button class="rowbtn" id="checkUpdateBtn"><span>Kiểm tra bản mới</span><span class="arrow" id="appVersionLabel">⇢</span></button>

      <div class="section-title">Khác</div>
      <button class="rowbtn" id="clearBtn" style="color:var(--red)"><span>Xoá toàn bộ dữ liệu</span><span class="arrow">⚠</span></button>
    </div>
  </div>

  <!-- ===================== BOTTOM NAV ===================== -->
  <div id="bottomNav">
    <button class="tab on" id="navChart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><span>Biểu đồ</span></button>
    <button class="add" id="navAdd" title="Thêm cân nặng" aria-label="Thêm cân nặng"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 4v22M4 15h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></button>
    <button class="tab" id="navSettings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Cài đặt</span></button>
  </div>

  <div id="credit">Created by Mondiro</div>
</div>

<!-- ===================== ADD/EDIT ENTRY MODAL (dùng chung cho nút + và nút sửa) ===================== -->
<div id="entryModal">
  <div class="modal-header"><span class="editIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span id="modalTitle">Cân hôm nay</span></div>
  <div id="entryPills">
    <button class="pill-btn" id="dateBtn"><span class="ic">📅</span><span id="dateBtnLabel">Hôm nay</span></button>
    <input type="date" id="dateSheetInput" style="position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; left:-9999px;">
    <button class="pill-btn" id="noteBtn"><span class="ic">💬</span><span id="noteBtnLabel">Thêm ghi chú</span></button>
  </div>
  <div id="pickerArea">
    <div class="wheel-center-line"></div>
    <div class="wheel-col" id="intCol"></div>
    <div class="dot-sep">,</div>
    <div class="wheel-col" id="decCol"></div>
    <div class="unit">kg</div>
  </div>
  <div id="modalNav">
    <button class="roundbtn ok" id="saveEntryBtn" aria-label="Lưu">✓</button>
    <button class="roundbtn cancel" id="cancelEntryBtn" aria-label="Huỷ">↩</button>
  </div>
</div>

<!-- note sheet -->
<div class="overlay" id="noteOverlay">
  <div class="sheet">
    <h3>Ghi chú</h3>
    <textarea id="noteSheetInput" placeholder="Ghi chú (vd: tối qua ăn lẩu, đi du lịch...)"></textarea>
    <div class="sheet-actions">
      <button class="cancel" id="noteCancelBtn">Huỷ</button>
      <button class="save" id="noteSaveBtn">Xong</button>
    </div>
  </div>
</div>

<!-- update sheet -->
<div class="overlay" id="updateOverlay">
  <div class="sheet">
    <h3 id="updateTitle">Có bản cập nhật mới</h3>
    <div id="updateText" style="font-size:14px; color:var(--text-dim); line-height:1.5; white-space:pre-line;"></div>
    <div class="sheet-actions" id="updateActions">
      <button class="cancel" id="updateLaterBtn">Để sau</button>
      <button class="save" id="updateNowBtn">Cập nhật</button>
    </div>
  </div>
</div>

<script src="seed-data.js"></script>
<script src="app.js"></script>
</body>
</html>
