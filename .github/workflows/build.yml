name: Build APK

on:
  push:
  workflow_dispatch:

# Mỗi lần push lên main: build APK (số build = github.run_number) rồi đăng lên
# repo public RELEASES_REPO. App đã cài trên các máy sẽ tự thấy bản mới khi mở.
env:
  RELEASES_REPO: satthupc00/weight_tracking_release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Capacitor sync (tái tạo capacitor-cordova-android-plugins + assets/public)
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept licenses & install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_log.txt

      - name: Report failure details as commit comment
        if: steps.build.outcome == 'failure'
        run: |
          ERR=$(tail -c 55000 build_log.txt)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(jq -n --arg body "$ERR" '{body: $body}')"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish update for installed apps (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Chưa có secret RELEASES_TOKEN — bỏ qua bước đăng bản cập nhật. Xem README mục Tự cập nhật."
            exit 0
          fi
          BUILD=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk WeightTracking.apk
          NOTES=$(printf '%s' "${COMMIT_MSG:-Bản build mới}" | head -c 1500)
          gh release create "build-$BUILD" WeightTracking.apk \
            --repo "$RELEASES_REPO" \
            --title "Weight Tracking 1.0.$BUILD" \
            --notes "$NOTES" \
            --latest
