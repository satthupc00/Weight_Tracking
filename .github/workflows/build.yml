name: Build APK

on:
  push:
    paths-ignore:          # chỉ sửa ghi chú/tài liệu thì không build + phát hành bản mới
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

# Mỗi lần push lên main: build APK (số build = github.run_number) rồi đăng lên
# GitHub Releases của chính repo này (repo public). App đã cài sẽ tự thấy bản mới khi mở.
env:
  # Repo phát hành CŨ — chỉ dùng tạm để các app đời cũ (đang hỏi repo này) nhận được bản chuyển tiếp.
  # Khi mọi máy đã cập nhật: xoá repo này + xoá secret RELEASES_TOKEN là xong, bước tương ứng tự bỏ qua.
  OLD_RELEASES_REPO: satthupc00/weight_tracking_release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # để xoá file APK của các lần build cũ
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Capacitor sync (tái tạo capacitor-cordova-android-plugins + assets/public)
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept licenses & install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Giải mã khoá ký (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mondiro.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mondiro.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_log.txt

      - name: Report failure details as commit comment
        if: steps.build.outcome == 'failure'
        run: |
          ERR=$(tail -c 55000 build_log.txt)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(jq -n --arg body "$ERR" '{body: $body}')"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish update for installed apps (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          BUILD=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk WeightTracking.apk
          # ghi chú bản phát hành = nội dung commit mới nhất (bỏ chữ [skip ci] và các dòng ký tên)
          NOTES=$(git log -1 --format=%B | sed -e 's/ *\[skip ci\]//' -e '/^Co-Authored-By:/d' -e '/^Claude-Session:/d' | head -c 1500)
          [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ] || NOTES="Bản build mới"
          gh release create "build-$BUILD" WeightTracking.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Weight Tracking 1.0.$BUILD" \
            --notes "$NOTES" \
            --latest
          # Repo public: chỉ giữ bản phát hành MỚI NHẤT (app chỉ cần bản mới nhất để cập nhật),
          # xoá các bản cũ cùng tag của chúng
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "build-$BUILD" ]; then
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            fi
          done
          # Xoá file APK đính kèm (artifact) của các lần build trước, chỉ giữ của lần này
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
          # Chuyển tiếp: đăng thêm 1 bản vào repo cũ để app đời cũ cập nhật được sang bản mới
          if [ -n "$OLD_TOKEN" ]; then
            GH_TOKEN="$OLD_TOKEN" gh release create "build-$BUILD" WeightTracking.apk \
              --repo "$OLD_RELEASES_REPO" \
              --title "Weight Tracking 1.0.$BUILD" \
              --notes "$NOTES" \
              --latest \
              || echo "::warning::Không đăng được vào repo cũ $OLD_RELEASES_REPO (đã xoá?). Có thể xoá secret RELEASES_TOKEN."
          fi
